# Hospital Management System Application

## Server Configuration
spring.application.name=HospitalApp
server.port=8080

# Duo Universal Prompt. Set these environment variables before enabling MFA.
hospital.duo.enabled=${DUO_ENABLED:false}
hospital.duo.client-id=${DUO_CLIENT_ID:}
hospital.duo.client-secret=${DUO_CLIENT_SECRET:}
hospital.duo.api-host=${DUO_API_HOST:}
hospital.duo.redirect-uri=${DUO_REDIRECT_URI:http://localhost:8080/api/auth/duo/callback}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

## Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/HospitalApp
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

## JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.defer-datasource-initialization=true

## Data Initialization
spring.sql.init.mode=never

## Logging
logging.level.root=INFO
logging.level.com.hospital.app=DEBUG

