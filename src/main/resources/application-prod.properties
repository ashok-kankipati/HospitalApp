# Enable with SPRING_PROFILES_ACTIVE=prod behind a trusted HTTPS ingress.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
hospital.duo.enabled=false
hospital.duo.client-id=${DUO_CLIENT_ID}
hospital.duo.client-secret=${DUO_CLIENT_SECRET}
hospital.duo.api-host=${DUO_API_HOST}
hospital.duo.redirect-uri=${DUO_REDIRECT_URI}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.com.hospital.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
