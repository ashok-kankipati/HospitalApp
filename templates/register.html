{% extends 'base.html' %}
{% block title %}Register - Household Expenses{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4 p-md-5">
<h2>Create account</h2><p class="text-muted mb-4">Register to keep your expenses private.</p>
<form method="POST"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ username }}" minlength="3" autocomplete="username" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required><div class="form-text">Use at least 8 characters.</div></div><div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-100">Register and create recovery key</button></form>
<p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div></div>{% endblock %}
