{% extends 'base.html' %}
{% block title %}Verify OTP - Household Expenses{% endblock %}
{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h2>Enter your OTP</h2><p class="text-muted">The email contains the registered username(s) and a six-digit OTP. It expires in 10 minutes.</p><form method="POST"><div class="mb-3"><label class="form-label">Recovery email</label><input class="form-control" type="email" name="email" value="{{ email }}" autocomplete="email" required></div><div class="mb-3"><label class="form-label">Username to reset</label><input class="form-control" name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" required></div><div class="mb-4"><label class="form-label">Six-digit OTP</label><input class="form-control" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></div><button class="btn btn-primary w-100">Verify OTP</button></form><p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Request a new OTP</a></p></div></div>{% endblock %}
