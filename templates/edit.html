{% extends 'base.html' %}
{% block title %}Edit Expense - Household Expenses{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Edit Purchase</h5>
        <form method="POST" action="{{ url_for('edit_expense', expense_id=expense['id']) }}">
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" value="{{ expense['date'] }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" value="{{ expense['description'] }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category">
              {% for c in categories %}
              <option value="{{ c }}" {% if expense['category'] == c %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Section</label>
            <select class="form-select" name="section">
              {% for s in sections %}
              <option value="{{ s }}" {% if expense['section'] == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="amount" value="{{ '%.2f'|format(expense['amount']) }}" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a class="btn btn-outline-secondary" href="{{ request.referrer or url_for('index') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
