{% extends 'base.html' %}
{% block title %}Recover account - Household Expenses{% endblock %}
{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h2>Recover your account</h2><p class="text-muted">Enter the 48-digit recovery key saved when the account was created. It will also identify your forgotten username.</p><form method="POST"><div class="mb-4"><label class="form-label">Recovery key</label><input class="form-control font-monospace" name="recovery_key" autocomplete="off" placeholder="000000-000000-000000-000000-000000-000000-000000-000000" required autofocus></div><button class="btn btn-primary w-100">Continue</button></form><p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Back to sign in</a></p></div></div>{% endblock %}
