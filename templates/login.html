{% extends 'base.html' %}
{% block title %}Sign in - Household Expenses{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4 p-md-5">
<h2>Welcome back</h2><p class="text-muted mb-4">Sign in to manage your household expenses.</p>
<form method="POST"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" required autofocus></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100">Sign in</button></form>
<p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot username or password?</a></p><p class="text-center text-muted mt-2 mb-0">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>{% endblock %}
