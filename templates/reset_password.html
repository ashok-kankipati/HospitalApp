{% extends 'base.html' %}
{% block title %}Reset password - Household Expenses{% endblock %}
{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h2>Choose a new password</h2>{% if username %}<p class="text-muted">Account: <strong>{{ username }}</strong></p>{% endif %}<form method="POST"><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required autofocus></div><div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-100">Reset password</button></form></div></div>{% endblock %}
